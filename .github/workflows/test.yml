name: tests

on:
  pull_request:
    branches:
      - "18.0*"
  push:
    branches:
      - "18.0"
      - "18.0-ocabot-*"

env:
  # the target branch (18.0, 19.0, …), which is the same as the Odoo version
  CACHE_REF: "${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}"

jobs:
  unreleased-deps:
    runs-on: ubuntu-latest
    name: Detect unreleased dependencies
    steps:
      - uses: actions/checkout@v4
      - run: |
          for reqfile in requirements.txt test-requirements.txt ; do
              if [ -f ${reqfile} ] ; then
                  result=0
                  # reject non-comment lines that contain a / (i.e. URLs, relative paths)
                  grep "^[^#].*/" ${reqfile} || result=$?
                  if [ $result -eq 0 ] ; then
                      echo "Unreleased dependencies found in ${reqfile}."
                      exit 1
                  fi
              fi
          done
  test:
    runs-on: ubuntu-22.04
    container: ${{ matrix.container }}
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - container: ghcr.io/oca/oca-ci/py3.10-odoo18.0:latest
            name: test with Odoo
          - container: ghcr.io/oca/oca-ci/py3.10-ocb18.0:latest
            name: test with OCB
            makepot: "true"
    services:
      postgres:
        image: postgres:12
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: odoo
        ports:
          - 5432:5432
    env:
      OCA_ENABLE_CHECKLOG_ODOO: "1"
      DUMP_PATH: "${{ github.workspace }}/.cache/odoo-dump"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install addons and dependencies
        run: oca_install_addons
      - name: Check licenses
        run: manifestoo -d . check-licenses
      - name: Check development status
        run: manifestoo -d . check-dev-status --default-dev-status=Beta
      - name: Cache test DB dump
        id: cache-dump
        uses: actions/cache@v4
        with:
          path: ${{ env.DUMP_PATH }}
          key: odoo-dump-${{ matrix.container }}-${{ env.CACHE_REF }}-${{ hashFiles('**/pyproject.toml', '**/__manifest__.py') }}
          restore-keys: |
            odoo-dump-${{ matrix.container }}-${{ env.CACHE_REF }}-
      - name: Initialize test db
        run: |
          oca_wait_for_postgres
          mkdir -p "$(dirname '${{ env.DUMP_PATH }}')"
          if [ -f "${{ env.DUMP_PATH }}" ]; then
            echo "Restoring test database from cached dump"
            dropdb --if-exists $PGDATABASE
            createdb $PGDATABASE
            pg_restore -j 2 -F c --exit-on-error -d $PGDATABASE "${{ env.DUMP_PATH }}"
          else
            echo "Initializing test database and creating cache dump"
            oca_init_test_database
            pg_dump -Fc -f "${{ env.DUMP_PATH }}" $PGDATABASE
          fi
      - name: Run tests
        run: oca_run_tests
      - name: Upload screenshots from JS tests
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: Screenshots of failed JS tests - ${{ matrix.name }}${{ join(matrix.include) }}
          path: /tmp/odoo_tests/${{ env.PGDATABASE }}
          if-no-files-found: ignore
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Update .pot files
        run: oca_export_and_push_pot https://x-access-token:${{ secrets.GIT_PUSH_TOKEN }}@github.com/${{ github.repository }}
        if: ${{ matrix.makepot == 'true' && github.event_name == 'push' && github.repository_owner == 'OCA' }}
